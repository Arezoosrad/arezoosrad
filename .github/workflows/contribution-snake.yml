name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Arezoosrad
          outputs: |
            assets/contribution-snake.svg?palette=github-dark
            assets/contribution-snake.gif?palette=github-dark

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: assets
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
